<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="IMG Platform - Entre para acessar o hub de jogos e o ecossistema IMG">
    <title>IMG Platform - Login</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#127795;</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="logo-section">
                <div class="logo-icon">&#127807;</div>
                <h1 class="game-title">IMG Platform</h1>
                <p class="game-subtitle">Entre no hub da plataforma e acesse o IMG online com login unico</p>
            </div>

            <div class="features">
                <div class="feature">
                    <span class="feature-icon">&#127969;</span>
                    <span>Hub central</span>
                </div>
                <div class="feature">
                    <span class="feature-icon">&#127795;</span>
                    <span>IMG online</span>
                </div>
                <div class="feature">
                    <span class="feature-icon">&#128167;</span>
                    <span>Perfil compartilhado</span>
                </div>
                <div class="feature">
                    <span class="feature-icon">&#127822;</span>
                    <span>Base pronta para novos jogos</span>
                </div>
            </div>

            <button class="google-btn" id="googleLoginBtn" type="button">
                <svg class="google-icon" viewBox="0 0 24 24">
                    <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/>
                    <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                    <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                    <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                </svg>
                Entrar com Google
            </button>

            <!-- Dev Login (only visible when APP_ENV=local) -->
            <div id="devLoginSection" class="hidden">
                <div class="dev-login-divider">
                    <div class="dev-login-divider-line"></div>
                    <span class="dev-login-tag">Dev Mode</span>
                    <div class="dev-login-divider-line"></div>
                </div>
                <input type="text" id="devName" placeholder="Nome" class="dev-input">
                <input type="email" id="devEmail" placeholder="Email" class="dev-input">
                <button id="devLoginBtn" type="button" class="dev-submit-btn">
                    🔧 Entrar como Dev
                </button>
            </div>

            <p class="error-msg hidden" id="errorMsg"></p>
        </div>

        <p class="footer">Plataforma de jogos com Three.js e backend compartilhado</p>
    </div>

    <script src="js/config.js?v=14"></script>
    <script src="shared/js/auth.js?v=1"></script>
    <script src="js/login.js"></script>

</body>
</html>
